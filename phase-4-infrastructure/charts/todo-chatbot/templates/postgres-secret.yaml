apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-postgres-secret
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
    app: postgres
type: Opaque
data:
  username: cG9zdGdyZXM=  # "postgres" in base64
  password: cG9zdGdyZXNwYXNz  # "postgrespass" in base64