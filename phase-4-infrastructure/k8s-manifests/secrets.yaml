apiVersion: v1
kind: Secret
metadata:
  name: neon-db-secret
  namespace: todo-system
type: Opaque
data:
  DATABASE_URL: <base64-encoded-database-url>

---
apiVersion: v1
kind: Secret
metadata:
  name: openai-api-secret
  namespace: todo-system
type: Opaque
data:
  OPENAI_API_KEY: <base64-encoded-openai-api-key>